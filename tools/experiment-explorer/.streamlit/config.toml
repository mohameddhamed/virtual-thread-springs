[theme]
base = "dark"
backgroundColor = "#0a1019"
secondaryBackgroundColor = "#121e2c"
textColor = "#e8eff7"
primaryColor = "#38bdf8"
borderColor = "#2c3a4d"
dataframeHeaderBackgroundColor = "#192536"
