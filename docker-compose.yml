version: '3.8'
services:
  demo-app:
    build: .
    container_name: vt-springs-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/thesis_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: thesis
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:15-alpine
    container_name: vt-springs-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: thesis
      POSTGRES_DB: thesis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vt-springs-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@thesis.local
      PGADMIN_DEFAULT_PASSWORD: thesis
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
